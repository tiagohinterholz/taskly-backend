services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskly
      # Read from .env (untracked, safe from `git reset --hard` on deploy —
      # see AD-017). Falls back to the dev placeholder if .env doesn't set
      # it, so local dev without a custom password keeps working unchanged.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskly}
      POSTGRES_DB: taskly
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskly -d taskly"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      # Bound to loopback only: public traffic reaches this container via
      # Nginx (reverse proxy on the same EC2 host/
      # deploy notes), not directly. Keeps the container off the public
      # interface entirely — defense in depth once Nginx owns port 80/443.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Overrides the .env value (which targets localhost:5433 for host-side
      # `uv run uvicorn`): inside the compose network the API reaches
      # Postgres via the service name on its container port. Password comes
      # from the same ${POSTGRES_PASSWORD} as the postgres service above —
      # never hardcoded here, so the two can never drift out of sync.
      DATABASE_URL: postgresql+asyncpg://taskly:${POSTGRES_PASSWORD:-taskly}@postgres:5432/taskly
    volumes:
      - attachments_data:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  attachments_data:
