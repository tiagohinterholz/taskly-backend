name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskly
          POSTGRES_PASSWORD: taskly
          POSTGRES_DB: taskly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskly -d taskly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://taskly:taskly@localhost:5432/taskly
      # CI-only value — never reused anywhere real. Real deployments set a
      # long random secret directly in the EC2 instance's .env (AD-009).
      JWT_SECRET: ci-only-test-secret-do-not-reuse-in-prod-32bytes
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked, fails if uv.lock is stale)
        run: uv sync --locked

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run test suite
        run: uv run pytest -q

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/taskly/backend
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            docker image prune -f
